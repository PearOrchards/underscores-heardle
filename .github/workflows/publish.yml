name: publish
# Build the image on every push to master and push it to GHCR. The server
# pulls it on the nightly schedule
concurrency:
  group: publish
  cancel-in-progress: true
on:
  push:
    branches:
      - master

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Set the repo variable URL to the prod domain (Settings > Variables);
          # it's baked into OpenGraph/metadata URLs at build time.
          build-args: |
            URL=${{ vars.URL || 'http://localhost:5000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
