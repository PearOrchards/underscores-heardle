name: update
run-name: Updating changes on server
concurrency: production
on:
  # Manual "deploy now" from the Actions tab
  workflow_dispatch:
  schedule:
    # Pull the latest image + restart daily at midnight UTC
    - cron: "0 0 * * *"
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PKEY" > ~/.ssh/pk
          chmod 600 ~/.ssh/pk
          cat >>~/.ssh/config <<END
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/pk
            StrictHostKeyChecking no
          END
        env:
          SSH_PKEY: ${{ secrets.SSH_PKEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
      - name: Deploy
        run: |
          ssh server '
            set -e
            cd heardle
            git pull --quiet
            docker compose pull --quiet
            docker compose up -d
            docker image prune -f
          '
