name: End-to-end

on:
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      HARDLY_RANDOM_SEED: "42"
      # Hardly any of this is exercised so all are just stubs
      SOUNDCLOUD_CLIENT: ci
      SOUNDCLOUD_SECRET: ci
      FALLBACK_CLIENT: ci
      URL: http://localhost:5000
      UNIX_TIMESTAMP_DAY_1: "0"
      AUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:5000
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed MongoDB
        run: node scripts/seed-ci.mjs

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: pnpm dev
          # Wait on the real page (not "/", which 307-redirects) so the dev server
          # has compiled the route and connected to Mongo before tests start.
          wait-on: http://localhost:5000/artists/underscores
          wait-on-timeout: 120
          browser: electron
          spec: cypress/e2e/app.cy.ts

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
