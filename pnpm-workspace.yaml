# Supply chain defense
minimumReleaseAge: 7200 # packages must be older than 5 days
minimumReleaseAgeStrict: true # always refuse
blockExoticSubdeps: true # blocks git URLs and raw tarballs
trustPolicy: no-downgrade # refuse versions in which the trust-evidence level decreases
trustPolicyIgnoreAfter: 7200 # overrule the rule above after 5 days (should be okay)
allowBuilds:
  "@parcel/watcher": true
  '@prisma/engines': true
  cypress: true
  esbuild: true
  ffmpeg-static: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true
